<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Edycja kolejności zdjęć</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{margin:0;padding:1rem;max-width:36rem;margin-inline:auto;line-height:1.4}
h1{font-size:1.25rem}
input,button{font:inherit;padding:.7rem;min-height:44px;border-radius:8px;border:1px solid #888;box-sizing:border-box}
input{width:100%}button{cursor:pointer;background:#222;color:#fff;border-color:#222}
button.s{background:transparent;color:inherit}
#list{list-style:none;padding:0;margin:1rem 0 5rem}
#list li{display:flex;align-items:center;gap:.8rem;padding:.4rem;border:1px solid #8885;border-radius:8px;margin-bottom:.4rem;background:Canvas}
#list li.drag{opacity:.6;outline:2px solid #c33}
#list img{width:48px;height:64px;object-fit:cover;border-radius:4px}
#list .n{flex:1;font-size:.85rem;color:#888}
#list .m{min-width:44px;padding:.4rem;background:transparent;color:inherit;border-color:#8888}#list li:first-child{border:2px solid #c90}#list li:first-child .n::after{content:' ★ GŁÓWNE';color:#c90;font-weight:bold}#list li.hit{outline:2px solid #3a3}
#list .h{touch-action:none;font-size:1.6rem;padding:.4rem .8rem;cursor:grab;user-select:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem;background:Canvas;border-top:1px solid #8885;display:flex;gap:.5rem;align-items:center}
#bar button.p{flex:1}#msg{font-size:.9rem}
</style></head><body>
<h1>Kolejność zdjęć</h1>
<div id="tok" hidden><p>Wklej token GitHub (zapisze się tylko w tej przeglądarce):</p><input id="t" type="password" autocomplete="off" placeholder="github_pat_..."><p><button id="ts" class="p">Zapisz token</button></p></div>
<div id="app" hidden><p>Przeciągnij zdjęcie za ☰. Pierwsze zdjęcie na liście (★) = główne zdjęcie u góry strony. Na koniec „Zapisz kolejność”.</p>
<ul id="list"></ul>
<div id="bar"><button class="p" id="save">Zapisz kolejność</button><button class="s" id="out">Wyloguj</button><span id="msg"></span></div></div><p id="err"></p>
<script>
var REPO='ppolanowski/portfolio-aktor',BR='gh-pages',list=document.getElementById('list'),msg=document.getElementById('msg');
function tk(){return localStorage.getItem('gh_tok')}
var started=false;
function ui(){var ok=!!tk();document.getElementById('tok').hidden=ok;document.getElementById('app').hidden=true;if(!ok)return;
 fetch('https://api.github.com/repos/'+REPO,{headers:{Authorization:'Bearer '+tk()}}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(j&&j.permissions&&j.permissions.push){document.getElementById('app').hidden=false;document.getElementById('err').textContent='';init()}
  else{localStorage.removeItem('gh_tok');document.getElementById('tok').hidden=false;document.getElementById('err').textContent='Token nie działa albo nie ma uprawnień.'}
 }).catch(function(){document.getElementById('err').textContent='Brak sieci'})}
document.getElementById('ts').onclick=function(){var v=document.getElementById('t').value.trim();if(v){localStorage.setItem('gh_tok',v);document.getElementById('t').value='';ui()}};
document.getElementById('out').onclick=function(){localStorage.removeItem('gh_tok');location.reload()};
ui();
function init(){if(started)return;started=true;
fetch('../index.html',{cache:'no-cache'}).then(function(r){return r.text()}).then(function(h){
 var d=new DOMParser().parseFromString(h,'text/html'),m={},ids=[];
 var hi=d.querySelector('.intro figure img'),HK=hi.getAttribute('src').match(/img\/(.+)-480/)[1];m[HK]=hi.getAttribute('src');ids.push(HK);
 d.querySelectorAll('.gallery li img').forEach(function(im){var k=im.getAttribute('src').match(/img\/(.+)-480/)[1];m[k]=im.getAttribute('src');ids.push(k)});
 return fetch('https://api.github.com/repos/'+REPO+'/contents/order.json?ref='+BR+'&t='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+tk(),Accept:'application/vnd.github.raw+json'}}).then(function(r){return r.ok?r.json():[]}).catch(function(){return[]}).then(function(o){
  var hero=Array.isArray(o)?HK:(o.hero||HK),oo=Array.isArray(o)?o:(o.order||[]);var ord=[hero].concat(oo.filter(function(k){return m[k]&&k!==hero}));ids.forEach(function(k){if(ord.indexOf(k)<0)ord.push(k)});
  ord.forEach(function(k){var li=document.createElement('li');li.dataset.id=k;li.innerHTML='<img alt="" src="../'+m[k]+'"><span class="n">'+k+'</span><span class="h" aria-label="Przeciągnij">☰</span>';list.appendChild(li)})})})}
list.addEventListener('click',function(e){var b=e.target.closest('.m');if(!b)return;var li=b.closest('li'),d=b.dataset.d;
 if(d=='top')list.insertBefore(li,list.firstChild);else if(d=='up'&&li.previousElementSibling)list.insertBefore(li,li.previousElementSibling);else if(d=='dn'&&li.nextElementSibling)list.insertBefore(li.nextElementSibling,li);
 li.classList.add('hit');setTimeout(function(){li.classList.remove('hit')},400);li.scrollIntoView({block:'nearest'});msg.textContent='Niezapisane zmiany'});
var cur=null;
list.addEventListener('pointerdown',function(e){var h=e.target.closest('.h');if(!h)return;cur=h.parentNode;cur.classList.add('drag');h.setPointerCapture(e.pointerId);e.preventDefault()});
list.addEventListener('pointermove',function(e){if(!cur)return;
 if(e.clientY<90)scrollBy(0,-14);else if(e.clientY>innerHeight-110)scrollBy(0,14);
 var t=document.elementFromPoint(list.getBoundingClientRect().left+20,e.clientY),li=t&&t.closest&&t.closest('#list li');
 if(li&&li!==cur){var r=li.getBoundingClientRect();list.insertBefore(cur,e.clientY<r.top+r.height/2?li:li.nextSibling)}});
function end(){if(cur){cur.classList.remove('drag');cur=null;msg.textContent='Niezapisane zmiany'}}
list.addEventListener('pointerup',end);list.addEventListener('pointercancel',end);
function og(id,H){return new Promise(function(res){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=1200;c.height=630;var w=im.naturalWidth,h=im.naturalHeight,sh=w*630/1200,y=Math.max(0,Math.min(h-sh,h*.12));c.getContext('2d').drawImage(im,0,y,w,sh,0,0,1200,630);res(c.toDataURL('image/jpeg',.82).split(',')[1])};im.onerror=function(){res(null)};im.src='/img/'+id+'-960.jpg'}).then(function(d){if(!d)return false;var u='https://api.github.com/repos/'+REPO+'/contents/img/og.jpg';
 return fetch(u+'?ref='+BR+'&t='+Date.now(),{headers:H,cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){var b={message:'Miniatura linku (edycja)',branch:BR,content:d};if(j&&j.sha)b.sha=j.sha;return fetch(u,{method:'PUT',headers:H,body:JSON.stringify(b)})}).then(function(r){return r.ok}).catch(function(){return false})})}
document.getElementById('save').onclick=function(){
 if(!tk()){ui();msg.textContent='Najpierw token';return}
 var ids2=[].map.call(list.children,function(li){return li.dataset.id}),order={hero:ids2[0],order:ids2.slice(1)},url='https://api.github.com/repos/'+REPO+'/contents/order.json',H={Authorization:'Bearer '+tk(),Accept:'application/vnd.github+json'};
 msg.textContent='Zapisuję…';
 fetch(url+'?ref='+BR+'&t='+Date.now(),{headers:H,cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
  var b={message:'Kolejnosc zdjec (edycja)',branch:BR,content:btoa(JSON.stringify(order))};if(j&&j.sha)b.sha=j.sha;
  return fetch(url,{method:'PUT',headers:H,body:JSON.stringify(b)})}).then(function(r){
  if(r.ok)return og(order.hero,H).then(function(ok){msg.textContent='Zapisano ✓ Na stronie głównej za 1–2 min.'+(ok?'':' (miniatura linku bez zmian)')});
  msg.textContent=r.ok?'Zapisano ✓ Na stronie głównej za 1–2 min.':'Błąd '+r.status+(r.status==401?' (zły token)':r.status==403||r.status==404?' (brak uprawnień tokena)':'')}).catch(function(){msg.textContent='Brak sieci'})};
</script></body></html>
