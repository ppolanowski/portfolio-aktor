<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Edycja kolejności zdjęć</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{margin:0;padding:1rem;max-width:36rem;margin-inline:auto;line-height:1.4}
h1{font-size:1.25rem}
input,button{font:inherit;padding:.7rem;min-height:44px;border-radius:8px;border:1px solid #888;box-sizing:border-box}
input{width:100%}button{cursor:pointer;background:#222;color:#fff;border-color:#222}
button.s{background:transparent;color:inherit}
#list{list-style:none;padding:0;margin:1rem 0 5rem}
#list li{display:flex;align-items:center;gap:.8rem;padding:.4rem;border:1px solid #8885;border-radius:8px;margin-bottom:.4rem;background:Canvas}
#list li.drag{opacity:.6;outline:2px solid #c33}
#list img{width:48px;height:64px;object-fit:cover;border-radius:4px}
#list .n{flex:1;font-size:.85rem;color:#888}
#list .h{touch-action:none;font-size:1.6rem;padding:.4rem .8rem;cursor:grab;user-select:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem;background:Canvas;border-top:1px solid #8885;display:flex;gap:.5rem;align-items:center}
#bar button.p{flex:1}#msg{font-size:.9rem}
</style></head><body>
<h1>Kolejność zdjęć</h1>
<div id="tok" hidden><p>Wklej token GitHub (zapisze się tylko w tej przeglądarce):</p><input id="t" type="password" autocomplete="off" placeholder="github_pat_..."><p><button id="ts" class="p">Zapisz token</button></p></div>
<p>Przytrzymaj ☰ i przeciągnij zdjęcie w górę lub w dół. Potem „Zapisz”.</p>
<ul id="list"></ul>
<div id="bar"><button class="p" id="save">Zapisz kolejność</button><button class="s" id="out">Wyloguj</button><span id="msg"></span></div>
<script>
var REPO='ppolanowski/portfolio-aktor',BR='gh-pages',list=document.getElementById('list'),msg=document.getElementById('msg');
function tk(){return localStorage.getItem('gh_tok')}
function ui(){document.getElementById('tok').hidden=!!tk()}
document.getElementById('ts').onclick=function(){var v=document.getElementById('t').value.trim();if(v){localStorage.setItem('gh_tok',v);document.getElementById('t').value='';ui()}};
document.getElementById('out').onclick=function(){localStorage.removeItem('gh_tok');ui()};
ui();
fetch('../index.html',{cache:'no-cache'}).then(function(r){return r.text()}).then(function(h){
 var d=new DOMParser().parseFromString(h,'text/html'),m={},ids=[];
 d.querySelectorAll('.gallery li img').forEach(function(im){var k=im.getAttribute('src').match(/img\/(.+)-480/)[1];m[k]=im.getAttribute('src');ids.push(k)});
 return fetch('../order.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():[]}).catch(function(){return[]}).then(function(o){
  var ord=o.filter(function(k){return m[k]});ids.forEach(function(k){if(ord.indexOf(k)<0)ord.push(k)});
  ord.forEach(function(k){var li=document.createElement('li');li.dataset.id=k;li.innerHTML='<img alt="" src="../'+m[k]+'"><span class="n">'+k+'</span><span class="h" aria-label="Przeciągnij">☰</span>';list.appendChild(li)})})});
var cur=null;
list.addEventListener('pointerdown',function(e){var h=e.target.closest('.h');if(!h)return;cur=h.parentNode;cur.classList.add('drag');h.setPointerCapture(e.pointerId);e.preventDefault()});
list.addEventListener('pointermove',function(e){if(!cur)return;
 if(e.clientY<90)scrollBy(0,-14);else if(e.clientY>innerHeight-110)scrollBy(0,14);
 var t=document.elementFromPoint(list.getBoundingClientRect().left+20,e.clientY),li=t&&t.closest&&t.closest('#list li');
 if(li&&li!==cur){var r=li.getBoundingClientRect();list.insertBefore(cur,e.clientY<r.top+r.height/2?li:li.nextSibling)}});
function end(){if(cur){cur.classList.remove('drag');cur=null}}
list.addEventListener('pointerup',end);list.addEventListener('pointercancel',end);
document.getElementById('save').onclick=function(){
 if(!tk()){ui();msg.textContent='Najpierw token';return}
 var order=[].map.call(list.children,function(li){return li.dataset.id}),url='https://api.github.com/repos/'+REPO+'/contents/order.json',H={Authorization:'Bearer '+tk(),Accept:'application/vnd.github+json'};
 msg.textContent='Zapisuję…';
 fetch(url+'?ref='+BR,{headers:H}).then(function(r){return r.ok?r.json():null}).then(function(j){
  var b={message:'Kolejnosc zdjec (edycja)',branch:BR,content:btoa(JSON.stringify(order))};if(j&&j.sha)b.sha=j.sha;
  return fetch(url,{method:'PUT',headers:H,body:JSON.stringify(b)})}).then(function(r){
  msg.textContent=r.ok?'Zapisano. Strona odświeży się za ok. minutę.':'Błąd '+r.status+(r.status==401?' (zły token)':r.status==403||r.status==404?' (brak uprawnień tokena)':'')}).catch(function(){msg.textContent='Brak sieci'})};
</script></body></html>
