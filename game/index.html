<!doctype html>
<html lang="pl">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>Kropla – relaksująca gra</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe9f5;touch-action:none;font:16px system-ui,sans-serif}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;left:12px;top:10px;color:#2b4a5a;font-weight:600;pointer-events:none;text-shadow:0 1px 0 #fff8}
#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:#2b4a5a;pointer-events:none;font-size:1.3rem;transition:opacity 1s}
#msg p{background:#fffc;padding:.8rem 1.2rem;border-radius:1rem;margin:0;max-width:20rem}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"><p>Kropla<br><small>← → lub dotykaj lewej/prawej strony ekranu, żeby przechylać świat.<br>Spacja / dotyk w środku = podskok.<br>Zjadaj jagody i dojdź do kwiatka.</small></p></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hud=document.getElementById('hud'),msg=document.getElementById('msg');
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

const L=9000;
const ground=x=>420+Math.sin(x*.0021)*150+Math.sin(x*.0057+1)*55+Math.sin(x*.013)*14-Math.min(x,900)*0+Math.max(0,x-L+800)*-.12;
const slope=x=>(ground(x+2)-ground(x-2))/4;

let b,berries,tilt,tiltT,keys={},touch=0,won,t0,msgT;
function init(){
  b={x:120,y:200,vx:0,vy:0,r:22,n:0,sq:0,wob:0};
  berries=[];
  for(let x=350;x<L-300;x+=70+Math.random()*90){
    berries.push({x,y:ground(x)-30-Math.random()*90,got:false,ph:Math.random()*6});
  }
  tilt=0;tiltT=0;won=false;t0=performance.now();
}
init();
function jump(){if(b.onG){b.vy-=380+b.r*2;b.sq=1;}}
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '){jump();e.preventDefault()}hideMsg()});
addEventListener('keyup',e=>keys[e.key]=0);
function tp(e){const t=e.touches;if(!t||!t.length){touch=0;return}const x=t[0].clientX/W;touch=x<.33?-1:x>.66?1:0;if(touch===0&&e.type==='touchstart')jump();hideMsg();e.preventDefault()}
['touchstart','touchmove','touchend','touchcancel'].forEach(n=>cv.addEventListener(n,tp,{passive:false}));
function hideMsg(){clearTimeout(msgT);msgT=setTimeout(()=>msg.style.opacity=0,600)}

function step(dt){
  const dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+touch;
  tiltT=Math.max(-1,Math.min(1,dir));
  tilt+=(tiltT-tilt)*Math.min(1,dt*3);
  const a=tilt*.62; // kąt przechyłu świata
  const g=520;
  b.vx+=Math.sin(a)*g*dt;b.vy+=Math.cos(a)*g*dt;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  b.onG=false;
  const gy=ground(b.x),s=slope(b.x),len=Math.hypot(1,s);
  const nx=-s/len,ny=-1/len; // normalna w górę
  const dist=(gy-b.y)*(-ny)/1; // przybliżona odległość od terenu wzdłuż normalnej
  const pen=b.r-((gy-b.y)/len);
  if(pen>0){
    b.x+=nx*pen;b.y+=ny*pen;
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){const imp=-vn*1.25;b.vx+=nx*imp;b.vy+=ny*imp;if(-vn>150)b.sq=Math.min(1,-vn/500);}
    const tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty;
    b.vx-=tx*vt*.4*dt;b.vy-=ty*vt*.4*dt;
    b.onG=true;
  }
  b.vx*=1-.9*dt;b.vy*=1-.1*dt;const sp=Math.hypot(b.vx,b.vy);if(sp>340){b.vx*=340/sp;b.vy*=340/sp}
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.5}
  if(b.x>L-b.r){b.x=L-b.r;b.vx=-Math.abs(b.vx)*.5}
  if(b.y>1400){b.x=Math.max(120,b.x-300);b.y=ground(b.x)-100;b.vx=b.vy=0}
  b.sq+=(0-b.sq)*Math.min(1,dt*6);
  b.wob+=dt*(3+Math.hypot(b.vx,b.vy)*.01);
  for(const q of berries)if(!q.got&&Math.hypot(q.x-b.x,q.y-b.y)<b.r+12){q.got=true;b.n++;b.r=22+Math.sqrt(b.n)*4.2}
  if(!won&&b.x>L-200){won=true;msg.innerHTML='<p>Kwiatek zakwitł 🌸<br><small>Czas: '+((performance.now()-t0)/1000|0)+' s · jagód: '+b.n+'/'+berries.length+'<br>Za chwilę zaczniemy od nowa</small></p>';msg.style.opacity=1;setTimeout(()=>{init();hideMsg()},7000)}
  hud.textContent='🫐 '+b.n+' / '+berries.length;
}

function draw(){
  const a=tilt*.62;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#bfe9f5');g.addColorStop(1,'#f9f2d4');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2,H/2);ctx.rotate(-a*.55);ctx.translate(-W/2,-H/2);
  const cx=b.x-W/2,cy=Math.min(b.y-H*.55,300);
  // tło: wzgórza paralaksy
  for(const[p,c,o]of[[.2,'#cfeedd',260],[.45,'#a9dcb8',330]]){
    ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(-200,H+300);
    for(let x=-200;x<=W+200;x+=40){const wx=x+cx*p;ctx.lineTo(x,H*.55+o*.2+Math.sin(wx*.003)*70+Math.sin(wx*.009)*20-cy*p*.5)}
    ctx.lineTo(W+200,H+300);ctx.fill();
  }
  ctx.translate(-cx,-cy);
  // teren
  const x0=cx-300,x1=cx+W+300;
  ctx.beginPath();ctx.moveTo(x0,cy+H+800);
  for(let x=x0;x<=x1;x+=16)ctx.lineTo(x,ground(x));
  ctx.lineTo(x1,cy+H+800);ctx.closePath();
  ctx.fillStyle='#8fd18a';ctx.fill();
  ctx.lineWidth=10;ctx.strokeStyle='#6bbf73';ctx.lineJoin='round';
  ctx.beginPath();for(let x=x0;x<=x1;x+=16)ctx[x===x0?'moveTo':'lineTo'](x,ground(x)+3);ctx.stroke();
  // jagody
  const T=performance.now()/1000;
  for(const q of berries){if(q.got||q.x<x0||q.x>x1)continue;
    const y=q.y+Math.sin(T*2+q.ph)*4;
    ctx.fillStyle='#7a6bd6';ctx.beginPath();ctx.arc(q.x,y,9,0,7);ctx.fill();
    ctx.fillStyle='#fff7';ctx.beginPath();ctx.arc(q.x-3,y-3,3,0,7);ctx.fill();}
  // kwiat na końcu
  const fx=L-120,fy=ground(fx);
  ctx.strokeStyle='#4fa35f';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(fx,fy);ctx.lineTo(fx,fy-70);ctx.stroke();
  ctx.fillStyle=won?'#ff9ec4':'#f4c6da';
  for(let i=0;i<6;i++){const an=i*Math.PI/3+(won?T:0);ctx.beginPath();ctx.arc(fx+Math.cos(an)*20,fy-80+Math.sin(an)*20,(won?15:11),0,7);ctx.fill()}
  ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(fx,fy-80,11,0,7);ctx.fill();
  // kropla (miękkie ciało)
  const sq=b.sq*.3,sp=Math.min(.25,Math.hypot(b.vx,b.vy)*.0004);
  ctx.save();ctx.translate(b.x,b.y);
  ctx.beginPath();
  const N=28;
  for(let i=0;i<=N;i++){const an=i/N*Math.PI*2;
    const w=1+Math.sin(an*3+b.wob)*.035+Math.sin(an*2-b.wob*1.3)*.03;
    const rx=b.r*w*(1+sq+sp*.5),ry=b.r*w*(1-sq-sp*.3);
    const px=Math.cos(an)*rx,py=Math.sin(an)*ry+(sq*b.r*.8);
    i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
  ctx.closePath();
  const gr=ctx.createRadialGradient(-b.r*.3,-b.r*.4,b.r*.1,0,0,b.r*1.1);
  gr.addColorStop(0,'#ffd3e8');gr.addColorStop(1,'#ff7fb5');ctx.fillStyle=gr;ctx.fill();
  const ex=Math.max(-1,Math.min(1,b.vx*.004))*b.r*.15;
  ctx.fillStyle='#2b2230';
  for(const s of[-1,1]){ctx.beginPath();ctx.arc(s*b.r*.32+ex,-b.r*.1,b.r*.11,0,7);ctx.fill()}
  ctx.strokeStyle='#2b2230';ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(ex,b.r*.12,b.r*.2,.15*Math.PI,.85*Math.PI);ctx.stroke();
  ctx.restore();
  ctx.restore();
}

let last=performance.now();
function loop(now){
  let dt=Math.min(.033,(now-last)/1000);last=now;
  const n=3;for(let i=0;i<n;i++)step(dt/n);
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
setTimeout(hideMsg,6000);
})();
</script>
</body>
</html>
